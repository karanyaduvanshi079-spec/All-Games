<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OX Game – Tic Tac Toe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style> 
:root{
  --bg:#020617;
  --card:#0f172a;
  --x:#38bdf8;
  --o:#fb7185;
  --win:#22c55e;
}

*{ box-sizing:border-box }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#020617,#000);
  font-family:system-ui,Arial;
  color:#fff;
}

.app{
  background:var(--card);
  padding:20px;
  border-radius:16px;
  width:320px;
  text-align:center;
  box-shadow:0 0 30px rgba(56,189,248,.25);
}

h2{
  margin:0 0 10px;
}

.status{
  margin-bottom:12px;
  font-size:16px;
}

.status .x{ color:var(--x); }
.status .o{ color:var(--o); }

.board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:14px 0;
}

.cell{
  aspect-ratio:1/1;
  background:#020617;
  border-radius:12px;
  font-size:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.2s;
}

.cell:hover{
  background:#020617aa;
}

.cell.x{ color:var(--x); }
.cell.o{ color:var(--o); }

.cell.win{
  background:var(--win);
  color:#000;
}

button{
  padding:8px 14px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:600;
  background:#38bdf8;
  color:#000;
}

button:hover{
  background:#0ea5e9;
}
</style>
<body>

<div class="app">
  <h2>🎮 OX Game</h2>

  <div class="status" id="status">
    Turn: <span class="x">X</span>
  </div>

  <div class="board" id="board"></div>

  <button id="restart">Restart</button>
</div>

<script src="script.js"></script>
</body>
</html>
